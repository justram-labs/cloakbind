name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -v tests

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse installer scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "$($f.Name): $($_.Message)" }; $failed = $true }
            else { Write-Host "OK $($f.Name)" }
          }
          if ($failed) { exit 1 }
